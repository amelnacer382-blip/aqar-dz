  - epic: 1
    action: >-
      Trancher la durée d'une session. Aucun `maxAge` n'est posé aujourd'hui :
      la valeur est celle par défaut de NextAuth, trente jours. Décision
      préalable au code de la story 1-8 (AC 6).
    owner: "Bilal"
    status: done
    note: >-
      Tranché le 12-08-2026, par délégation explicite de l'éditeur.
      DOUZE HEURES. Trente jours n'est pas une session, c'est un identifiant
      permanent laissé dans un navigateur : sur un outil qui détient des
      pièces d'identité et des actes de propriété, la durée d'un accès ne
      doit pas survivre au poste de travail. Douze heures couvrent la
      journée d'une agence, du matin au soir ; le coût est une reconnexion
      par jour, et c'est le prix normal. Réversible en une ligne de
      auth.config.ts — si les agences se plaignent, la valeur monte, mais
      elle part de ce qui protège et non de ce qui est confortable.
  - epic: 1
    action: >-
      Décider si le dépôt doit conserver la stratégie JWT ou passer à des
      sessions en base. La question est ouverte par le défaut n° 33 et n'est
      PAS tranchée par les stories 1-8 et 5-8, qui la contournent toutes deux.
      À rouvrir seulement si un besoin réel de déconnexion immédiate et
      centralisée apparaît (multi-instances, exigence d'un client).
    owner: "Bilal"
    status: open
    note: >-
      Ce n'est pas un correctif mais une décision d'architecture : la
      stratégie JWT est une règle de CLAUDE.md §12 (règle 4), elle ne se change
      pas dans une story de remise en état.
  - epic: 4
    action: >-
      Trancher qui peut supprimer une échéance de gestion locative, et qui peut
      supprimer une ligne d'historique d'interaction. Ces deux actions n'ont
      aucune route d'API homologue : contrairement au bien, à la visite et au
      paiement, aucune règle n'est déjà écrite ailleurs dans le code. Décision
      préalable au code de la story 4-6 (AC 4).
    owner: "Bilal"
    status: done
    note: >-
      Tranché le 12-08-2026, par délégation explicite de l'éditeur.
      ÉCHÉANCE DE GESTION LOCATIVE → administrateur. Une échéance est une ligne
      comptable : la supprimer fausse le décompte du net à reverser au
      propriétaire, et l'erreur ne se voit qu'au moment du versement, chez le
      propriétaire. Le coût d'une permission trop étroite est un agent qui
      demande à son administrateur ; le coût de l'inverse est un litige.
      INTERACTION → agent, mais journalisée. C'est une ligne d'historique de
      contact, saisie par l'agent lui-même à l'instant : la réserver rendrait
      une faute de frappe ineffaçable pour celui qui l'a commise, ce qui
      pousserait à contourner l'outil. Le journal d'audit couvre l'abus.
      Réversible tant que la story 4-6 n'a pas commencé — c'est une ligne de
      garde à changer, pas une architecture.

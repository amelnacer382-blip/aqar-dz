events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $http_x_forwarded_for a ete retire du format.
    #
    # C'est l'en-tete RECU DU CLIENT — proxy_set_header ne le modifie pas.
    # Depuis que nous ne le transmettons plus a l'application, la seule
    # chose qu'il journalisait etait une valeur choisie par l'appelant,
    # posee a cote de $remote_addr sans rien qui les distingue. Une
    # adresse forgee dans le journal d'acces n'informe pas : elle egare
    # celui qui enquete.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;

    upstream nextjs {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # Static files
        location /_next/static {
            proxy_pass http://nextjs;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, immutable";

            # Quatrieme bloc qui relaie vers l'application : rien n'y est
            # compte aujourd'hui, mais l'invariant « nginx ecrase toujours
            # ce que le client a ecrit » doit valoir pour TOUS les
            # relais, sans quoi il ne vaut pour aucun.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploads : servis depuis le volume, pas par l'application.
        #
        # Next ne peut pas s'en charger : en sortie autonome, il dresse
        # l'inventaire de public/ une fois au demarrage et le garde. Une
        # photo televersee apres ce moment repondait 404 jusqu'au
        # redemarrage suivant — invisible en developpement, ou le serveur
        # relit le dossier a chaque requete, donc invisible tout court.
        #
        # nginx lit le disque a chaque appel et sert le fichier sans
        # reveiller Node.
        # Les documents ne sont PAS servis depuis le disque.
        #
        # Pieces d'identite, actes de propriete, contrats : leur lecture
        # doit etre soumise a une session et a l'appartenance a l'agence,
        # ce que nginx ne sait pas verifier. Ils passent par
        # /api/documents/{id}/file, qui applique la meme garde que le
        # reste de l'espace de gestion.
        #
        # nginx choisit le prefixe le plus long : ce bloc l'emporte sur
        # /uploads/ quelle que soit sa position dans le fichier. Il est
        # place avant pour que la lecture suive la meme logique.
        location /uploads/documents/ {
            return 404;
        }

        location /uploads/ {
            alias /var/www/uploads/;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";

            # Ces fichiers viennent de l'exterieur : le navigateur ne doit
            # pas deviner leur nature d'apres leur contenu. L'en-tete pose
            # par l'application ne s'applique plus ici, puisque ce n'est
            # plus elle qui repond.
            add_header X-Content-Type-Options "nosniff";
        }

        # X-Forwarded-For : on ECRASE, on n'ajoute pas (BUG-20).
        #
        # $proxy_add_x_forwarded_for ajoutait $remote_addr A LA FIN de la
        # liste envoyee par le client, en gardant ce que celui-ci avait
        # ecrit devant. L'application lisait la premiere valeur : elle
        # comptait donc une identite choisie par l'appelant, et toute
        # limitation de debit se remettait a zero avec un en-tete.
        # $remote_addr seul est la vue de nginx, que le client ne controle
        # pas ; rien de ce qu'il envoie n'atteint plus l'application.
        #
        # A REVOIR si un CDN ou un second proxy est place en amont : sa
        # propre adresse deviendrait $remote_addr et l'adresse du visiteur
        # serait perdue. Il faudrait alors la reprendre dans la liste
        # transmise par l'amont, en sautant un nombre CONNU de sauts de
        # confiance — et non « la premiere » ni « la derniere ».

        # API routes with rate limiting
        location /api {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Upload endpoint with stricter rate limit
        location /api/upload {
            limit_req zone=upload burst=5 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M;
        }

        # All other routes
        #
        # `$http_host` ET NON `$host` : c'est ce bloc qui porte les Server
        # Actions, et `$host` PERD LE PORT. Next 14 compare l'hote transmis
        # a l'`Origin` du navigateur au titre de sa protection anti-CSRF :
        # `localhost` contre `localhost:8095`, aucune egalite, et il
        # ABANDONNE l'action — « Invalid Server Actions request », POST 500.
        #
        # Les 41 Server Actions du produit etaient mortes sur ce
        # deploiement : creation, edition, corbeille, console de l'editeur,
        # formulaire public de la vitrine, et `explainLoginFailure` — si
        # bien qu'aucun echec de connexion n'affichait son motif. Seules
        # survivaient la navigation, la connexion, les exports, les PDF et
        # les suppressions par route API : le produit etait en lecture
        # seule SAUF POUR SUPPRIMER.
        #
        # Mesure du 15-08-2026, BUG-36, story 5.14 : la meme action publique
        # repondait 500 via nginx et 303 en direct sur le conteneur.
        #
        # `$http_host` est vide si le client n'envoie pas d'en-tete `Host`.
        # HTTP/1.1 l'exige et nginx repond 400 sans lui ; le cas ne subsiste
        # qu'en HTTP/1.0, ou ce produit ne fonctionne de toute facon pas. Un
        # repli par `map` a donc ete ECARTE a dessein : une piece mobile de
        # plus dans un fichier que personne ne relit.
        #
        # Ce n'est PAS un assouplissement : `$host` derivait deja de
        # l'en-tete `Host` du client, seul le port etait perdu. Ce qui reste
        # ouvert — nginx n'a qu'un bloc `server`, il accepte donc n'importe
        # quel `Host` — est REP-94, hors perimetre.
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
